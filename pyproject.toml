[build-system]
requires = [
    "setuptools>=54.1.2",
    "wheel",
    "scikit-build>=0.17.5",
    "cmake>=3.13.3",
    "ninja",
    "swig",
]

[project]
name = "pc_ble_driver_py"
version = "0.17.0"
description = "Python bindings for the Nordic pc-ble-driver SoftDevice serialization library"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "wrapt",
    "cryptography",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "scikit-build>=0.17.5",
    "cmake>=3.13.3",
    "ninja~=1.9.0",
    "tox~=3.9.0",
]
lint = [
    "ruff>=0.9",
]
test = [
    "unittest-xml-reporting==3.0.4",
]

[tool.uv]
default-groups = ["dev"]
# Native extension; do not install the project itself during `uv sync`.
package = false

[tool.ruff]
target-version = "py310"
src = ["pc_ble_driver_py", "tests", "scripts"]
extend-exclude = [
    "pc_ble_driver_py/hex",
    "pc_ble_driver_py/lib",
    ".nrf-ble-driver",
    "_skbuild",
    "dist",
    "wheelhouse",
]

[tool.ruff.lint]
# Flake8-compatible starter set (pycodestyle + pyflakes).
select = ["E", "F", "W"]
ignore = [
    "E501",  # existing generated/wrapper code exceeds 88 columns
]

[tool.ruff.lint.per-file-ignores]
# Convenience star-imports re-export driver types and observers.
"pc_ble_driver_py/ble_adapter.py" = ["F403", "F405"]
"pc_ble_driver_py/examples/*.py" = ["F403", "F405"]
# Native bindings are imported after runtime config is applied.
"pc_ble_driver_py/ble_driver.py" = ["E402", "E721", "F403", "F405"]
"tests/**/*.py" = ["E402", "E701", "E712", "E721", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.cibuildwheel]
# CPython 3.10, 3.12, and 3.14. Skip PyPy, musllinux, 32-bit, ARM Windows, and free-threaded.
build = ["cp310-*", "cp312-*", "cp314-*"]
skip = [
    "pp*",
    "*musllinux*",
    "*-win32",
    "*-win_arm64",
    "*-manylinux_i686",
    "*-manylinux_aarch64",
    "*-manylinux_ppc64le",
    "*-manylinux_s390x",
    "*-manylinux_armv7l",
    "*-manylinux_riscv64",
    "cp3??t-*",
]
archs = ["auto64"]
build-verbosity = 1
# Hardware tests need two Nordic DKs; CI only smoke-imports the extension.
test-command = "python -c \"from pc_ble_driver_py.lib import nrf_ble_driver_sd_api_v2, nrf_ble_driver_sd_api_v5; print('ok')\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "python {package}/scripts/install_nrf_ble_driver.py"
# libudev is expected on Linux hosts that talk to USB serial adapters.
repair-wheel-command = "auditwheel repair --exclude libudev.so.1 -w {dest_dir} {wheel}"
environment = { NRF_BLE_DRIVER_PREFIX = "/tmp/nrf-ble-driver", CMAKE_PREFIX_PATH = "/tmp/nrf-ble-driver" }

[tool.cibuildwheel.macos]
archs = ["native"]
before-all = "python {package}/scripts/install_nrf_ble_driver.py"
environment = { NRF_BLE_DRIVER_PREFIX = "/tmp/nrf-ble-driver", CMAKE_PREFIX_PATH = "/tmp/nrf-ble-driver" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-all = "python {package}/scripts/install_nrf_ble_driver.py"
environment = { NRF_BLE_DRIVER_PREFIX = "C:/nrf-ble-driver", CMAKE_PREFIX_PATH = "C:/nrf-ble-driver", PATH = "C:/nrf-ble-driver/bin;$PATH" }
