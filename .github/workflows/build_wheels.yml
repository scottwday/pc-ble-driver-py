name: Build wheels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --only-group lint
      - run: uv run ruff check pc_ble_driver_py tests scripts

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native builds: Linux x86_64, Windows AMD64, macOS Intel, macOS Apple Silicon
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}simple/
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Generate simple repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/simple/pc-ble-driver-py

          cat > site/simple/index.html <<'EOF'
          <!DOCTYPE html>
          <html><body>
            <a href="pc-ble-driver-py/">pc-ble-driver-py</a>
          </body></html>
          EOF

          {
            echo '<!DOCTYPE html>'
            echo '<html><body>'
            gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -r '
                [ .[][]
                  | select(.draft | not)
                  | .assets[]
                  | select(.name | endswith(".whl"))
                ]
                | sort_by(.name)
                | .[]
                | "  <a href=\"\(.browser_download_url | @html)\">\(.name | @html)</a><br>"
              '
            echo '</body></html>'
          } > site/simple/pc-ble-driver-py/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy index
        id: deployment
        uses: actions/deploy-pages@v4
